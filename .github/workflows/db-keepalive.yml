name: Database Health Check & Cluster Resume

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  db-keepalive:
    name: Check & Resume MongoDB Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Database Status & Resume Cluster
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          ATLAS_GROUP_ID: ${{ secrets.ATLAS_GROUP_ID }}
          ATLAS_CLUSTER_NAME: ${{ secrets.ATLAS_CLUSTER_NAME }}
        run: |
          npm install mongoose --no-save
          node -e '
            const mongoose = require("mongoose");
            async function run() {
              const uri = process.env.MONGODB_URI;
              if (!uri) {
                console.error("❌ MONGODB_URI secret is missing.");
                process.exit(1);
              }
              console.log("🔍 Checking MongoDB Status at", new Date().toISOString());
              try {
                await mongoose.connect(uri, { serverSelectionTimeoutMS: 15000 });
                const ping = await mongoose.connection.db.admin().ping();
                console.log("✅ Database is LIVE! Ping response:", ping);
                await mongoose.disconnect();
                process.exit(0);
              } catch (err) {
                console.warn("⚠️ Database ping/connect failed:", err.message);
                
                const { ATLAS_PUBLIC_KEY, ATLAS_PRIVATE_KEY, ATLAS_GROUP_ID, ATLAS_CLUSTER_NAME } = process.env;
                if (ATLAS_PUBLIC_KEY && ATLAS_PRIVATE_KEY && ATLAS_GROUP_ID && ATLAS_CLUSTER_NAME) {
                  console.log("🚀 Attempting explicit Atlas API Cluster Resume...");
                  try {
                    const auth = Buffer.from(`${ATLAS_PUBLIC_KEY}:${ATLAS_PRIVATE_KEY}`).toString("base64");
                    const res = await fetch(`https://cloud.mongodb.com/api/atlas/v1.0/groups/${ATLAS_GROUP_ID}/clusters/${ATLAS_CLUSTER_NAME}`, {
                      method: "PATCH",
                      headers: { "Content-Type": "application/json", "Authorization": `Digest ${auth}` },
                      body: JSON.stringify({ paused: false })
                    });
                    console.log(res.ok ? "✅ Atlas resume request sent successfully." : "❌ Atlas API request failed with status: " + res.status);
                  } catch (e) {
                    console.error("❌ Atlas API call failed:", e.message);
                  }
                } else {
                  console.log("ℹ️ Note: Connection attempt initiated standard cluster wake-up sequence.");
                }
                process.exit(1);
              }
            }
            run();
          '
